const START='2026-10-13';const DAYS=['Niedziela','Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota'];const KEY='redukcja_v1';const initial={settings:{cal:2300,protein:160,fat:70,carbs:258,targetWeight:70,targetWaist:86,steps:8000},weight:[],waist:[],food:[],runs:[],workouts:[],overrides:{}};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){db=structuredClone(initial)}db.settings={...initial.settings,...db.settings};for(const k of ['weight','waist','food','runs','workouts'])db[k]??=[];db.overrides??={};let tab='Dzisiaj';const tabs=['Dzisiaj','Siłownia','Bieganie','Pomiary','Jedzenie','Ustawienia'];const $=s=>document.querySelector(s),escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const dateDay=d=>new Date(d+'T12:00:00').getDay();const planned=d=>({1:'A',2:'Bieg spokojny',3:'B',4:'Bieg spokojny',5:'Bieg opcjonalny',6:'Bieg opcjonalny',0:'Bieg opcjonalny'}[dateDay(d)]||'Regeneracja');const assigned=d=>db.overrides[d]||planned(d);const last=(list)=>list.length?list.slice().sort((a,b)=>b.date.localeCompare(a.date))[0]:null;function save(){localStorage.setItem(KEY,JSON.stringify(db))}function setTab(t){if(tab==='Siłownia')saveDraft();tab=t;render()}function nav(){ $('#tabs').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" data-tab="${t}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab))}function metric(label,value,unit=''){return `<div class="metric"><span class="label">${label}</span><strong>${value}${unit?' '+unit:''}</strong></div>`}function latestVal(list,defaultVal){let l=last(list);return l?Number(l.value):defaultVal}function n(v){return Number(String(v).replace(',','.'))}function fmt(v,d=1){return Number(v).toFixed(d).replace('.',','  const movements=a

function updateWarmup(){
 const el=document.getElementById('wuResults'),inp=document.getElementById('wuTarget');
 if(!el||!inp)return;
 const w=Number(inp.value);
 if(!inp.value||!Number.isFinite(w)||w<=0){el.textContent='Wpisz ciężar roboczy, aby zobaczyć propozycję rozgrzewki.';return}
 const bar=20,round=x=>Math.round(x/2.5)*2.5;
 const weights=[.35,.65,.85].map(p=>Math.max(bar,Math.min(w,round(w*p))));
 const reps=[10,5,3];
 const uniq=weights.map((v,i)=>({v,reps:reps[i]})).filter((x,i,arr)=>i===0||x.v>arr[i-1].v);
 if(w<=bar){el.innerHTML='<p>Przy takim ciężarze wystarczy 1–2 lekkie serie techniczne pustym gryfem, bez zmęczenia.</p>';return}
 el.innerHTML='<div class="wu-table">'+uniq.map((x,i)=>`<div><span>Rozgrzewkowa ${i+1}</span><strong>${x.v} kg × ${x.reps}</strong></div>`).join('')+`<div class="wu-work"><span>Serie robocze</span><strong>${w} kg</strong></div></div>`;
}

function workoutHistory(){
 const items=db.workouts.slice().sort((a,b)=>b.date.localeCompare(a.date));
 return `<section class="panel"><h2>Historia siłowni</h2>${items.map(x=>`<details class="workout history-entry"><summary><strong>${escapeHTML(x.date)} · Trening ${escapeHTML(x.type)}</strong><span class="muted">${x.exercises?.length||0} ćwiczeń ▾</span></summary><div class="row history-actions"><button class="small-btn" data-edit-workout="${escapeHTML(x.id||x.date+'|'+x.type)}">Otwórz i edytuj</button><button class="small-btn" data-delete-workout="${escapeHTML(x.id||x.date+'|'+x.type)}">Usuń</button></div>${(x.exercises||[]).map(e=>`<div class="history-exercise"><strong>${escapeHTML(e.name)}</strong><div class="history-table"><div class="history-heading"><span>Seria</span><span>Ciężar</span><span>Powt./czas</span><span>RIR</span></div>${(e.series?.length?e.series:[{kg:e.kg,reps:e.actualReps||e.reps,rir:e.rir}]).map((z,j)=>`<div class="history-set"><span>${j+1}</span><span>${z.kg!==''&&z.kg!=null?escapeHTML(String(z.kg))+' kg':'—'}</span><span>${escapeHTML(String(z.reps||'—'))}</span><span>${z.rir!==''&&z.rir!=null?escapeHTML(String(z.rir)):'—'}</span></div>`).join('')}</div>${e.failure?'<small class="muted">Ostatnia seria do upadku technicznego</small>':''}</div>`).join('')}${x.notes?`<p class="muted">Uwagi: ${escapeHTML(x.notes)}</p>`:''}</details>`).join('')||'<p class="muted">Brak zapisanych treningów.</p>'}</section>`;
}
function loadWorkoutToDraft(x){
 workoutType=x.type;workoutDate=x.date;
 drafts[draftKey()]={date:x.date,type:x.type,notes:x.notes||'',target:'',updated:new Date().toISOString(),exercises:(x.exercises||[]).map(e=>({series:e.series?.length?e.series:[{kg:e.kg||'',reps:'',rir:e.rir||''}],failure:!!e.failure}))};
 localStorage.setItem(DRAFT_KEY,JSON.stringify(drafts));tab='Siłownia';render();
}
let workoutType='A';function gymView(){let groups=workoutGroups[workoutType];let rows=groups.map((g,gi)=>`<div class="workout"><div class="group-header"><h3>${escapeHTML(g.title)}</h3><p class="muted">${escapeHTML(g.rest)} · ${escapeHTML(g.rir)}</p></div>${g.ids.map(i=>{let e=exercises[workoutType][i];let url=atlasLinks[workoutType][i];return `<div class="exercise-item"><strong>${i+1}. ${escapeHTML(e[0])}</strong><div class="atlas-links">${url?`<a href="${url}" target="_blank" rel="noopener noreferrer">📖 Atlas Fabryki Siły ↗</a>`:`<span class="muted">Brak potwierdzonego odnośnika w atlasie</span>`}</div><div class="set-head"><span>Seria</span><span>Ciężar (kg)</span><span>Powt. / czas</span><span>RIR</span></div><div class="set-rows" id="setRows${i}">${Array.from({length:Number(e[1])},(_,j)=>`<div class="set-row"><span class="set-number">${j+1}</span><input aria-label="Ciężar seria ${j+1}" data-set-kg="${i}" type="number" min="0" step="0.5" placeholder="kg"><input aria-label="Powtórzenia seria ${j+1}" data-set-reps="${i}" type="text" inputmode="numeric" placeholder="${escapeHTML(e[2])}"><input aria-label="RIR seria ${j+1}" data-set-rir="${i}" type="number" min="0" max="10" placeholder="2"></div>`).join('')}</div><p class="set-hint">Plan: ${e[1]} serie × ${escapeHTML(e[2])}. Ciężar możesz powtórzyć z poprzedniej serii przyciskiem ↳.</p><button type="button" class="small-btn" data-copy-kg="${i}">↳ Powiel ciężar z 1. serii</button><label class="failure-toggle"><input type="checkbox" id="fail${i}"><span>Ostatnia seria do upadku technicznego</span></label>${e[0].includes('Martwy ciąg rumuński z hantlami')?'<p class="note gym-tip">🏋️ RDL: wpisuj ciężar <strong>jednego hantla</strong>. Prowadź hantle blisko nóg, cofaj biodra i utrzymuj neutralny kręgosłup.</p>':''}${e[0].includes('Martwy robak')?'<p class="note gym-tip">Martwy robak: 24 ruchy łącznie, naprzemiennie po 12 na stronę. Skróć zakres, jeśli odrywasz lędźwie lub pojawia się ból.</p>':''}${e[0].includes('Spacer farmera')?'<p class="note gym-tip">🚶 Spacer farmera: trzy przejścia po 30–45 sekund. Trzymaj hantle po bokach, tułów stabilny, idź po płaskiej nawierzchni. W polu „Ciężar” wpisz masę <strong>jednego hantla</strong>.</p>':''}</div>`}).join('')}</div>`).join('');return `<section class="panel"><h2>Trening siłowy · superserie</h2><div class="row"><button data-type="A" class="${workoutType==='A'?'primary':''}">Trening A</button><button data-type="B" class="${workoutType==='B'?'primary':''}">Trening B</button></div><p class="muted">Rozgrzewka i serie przygotowawcze są opisane poniżej. W superserii wykonuj dwa ćwiczenia po kolei, następnie odpocznij. RIR to liczba powtórzeń pozostawionych w zapasie. Nie wykonuj do upadku przysiadów, RDL ani wyciskań sztangi bez asekuracji. Pompki i brzuch: 0 kg = masa własnego ciała. Przy RDL wpisuj ciężar jednego hantla. Martwy robak i brzuszki wykonuj w superserii. Czas całości orientacyjnie 40–50 minut.</p>${warmupView()}<div class="workout"><strong>⏱ Minutnik przerw</strong><p id="restDisplay" style="font-size:30px;font-weight:700;margin:8px 0">Gotowe</p><div class="row"><button data-rest="45">45 s</button><button data-rest="60">60 s</button><button data-rest="90">90 s</button><button data-rest="120">120 s</button><button id="stopRest">Stop</button></div></div><label class="label">Data treningu</label><input type="date" id="gymDate" value="${workoutDate}">${rows}<p class="note gym-tip gym-tip--farmer">W treningu B spacer farmera i unoszenie bioder mają po 6 serii łącznie, ponieważ oba bloki występują dwukrotnie w Garmin Connect.</p><div class="note" id="draftStatus">Wpisy zapisują się automatycznie jako szkic.</div><label class="label">Uwagi</label><textarea id="gymNotes" rows="2" style="width:100%" placeholder="Samopoczucie, technika, trudność..."></textarea><div class="row" style="margin-top:12px"><button class="primary" id="saveGym">Zapisz ukończony trening</button><button id="clearDraft" type="button">Wyczyść szkic</button></div></section>${workoutHistory()}`}
function runView(){return `<section class="panel"><h2>Dziennik biegania</h2><p class="note">Wtorek i czwartek: spokojny bieg 5–7 km (około 35–50 min), tempo rozmowne, orientacyjnie 130–150 bpm. Piątek/weekend: opcjonalnie 5–8 km spokojnie, jeśli jesteś zregenerowany. Nie musisz poprawiać rekordu na każdym treningu.</p><div class="grid"><div class="field"><label>Data</label><input id="runDate" type="date" value="${today()}"></div><div class="field"><label>Dystans (km)</label><input id="runKm" type="number" step="0.01" min="0" placeholder="6.2"></div><div class="field"><label>Czas (minuty)</label><input id="runMin" type="number" step="0.01" min="0" placeholder="39"></div><div class="field"><label>Średnie HR</label><input id="runHr" type="number" min="0" placeholder="145"></div></div><p><button class="primary" id="saveRun">Zapisz bieg</button></p></section><section class="panel"><h2>Historia biegów</h2><table><tr><th>Data</th><th>Km</th><th>Tempo</th><th>HR</th></tr>${db.runs.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${fmt(x.km,2)}</td><td>${x.min&&x.km?pace(x.min/x.km):'—'}</td><td>${x.hr||'—'}</td></tr>`).join('')}</table>${db.runs.length?'':'<p class="muted">Brak wpisów. Historyczne wyniki możesz dopisać ręcznie.</p>'}</section>`}function pace(m){let sec=Math.round(m*60);return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}/km`}
function chart(list,goal,title){let sorted=list.slice().sort((a,b)=>a.date.localeCompare(b.date));if(sorted.length<2)return `<p class="muted">Dodaj przynajmniej dwa pomiary, aby zobaczyć wykres.</p>`;let vals=sorted.map(x=>Number(x.value));let low=Math.min(...vals,goal)-1,high=Math.max(...vals,goal)+1;let pts=sorted.map((x,i)=>`${30+i*640/(sorted.length-1)},${170-(x.value-low)/(high-low)*145}`).join(' ');let gy=170-(goal-low)/(high-low)*145;return `<svg viewBox="0 0 700 205" role="img" aria-label="Wykres ${title}"><line x1="30" y1="${gy}" x2="670" y2="${gy}" stroke="#5a8c75" stroke-dasharray="6 5"/><polyline points="${pts}" fill="none" stroke="#60a5fa" stroke-width="3"/>${sorted.map((x,i)=>`<circle cx="${30+i*640/(sorted.length-1)}" cy="${170-(x.value-low)/(high-low)*145}" r="4" fill="#93c5fd"/>`).join('')}<text x="35" y="195" fill="#9ca3af" font-size="13">${sorted[0].date}</text><text x="555" y="195" fill="#9ca3af" font-size="13">${sorted.at(-1).date}</text><text x="35" y="16" fill="#9ca3af" font-size="13">${fmt(high)} ${title==='Masa'?'kg':'cm'}</text><text x="35" y="170" fill="#9ca3af" font-size="13">${fmt(low)}</text></svg>`}function measuresView(){return `<section class="panel"><h2>Dodaj pomiar</h2><div class="grid"><div class="field"><label>Data</label><input id="measureDate" type="date" value="${today()}"></div><div class="field"><label>Masa (kg)</label><input id="measureWeight" type="number" step="0.1" placeholder="81"></div><div class="field"><label>Brzuch na wysokości pępka (cm)</label><input id="measureWaist" type="number" step="0.1" placeholder="97"></div></div><p><button class="primary" id="saveMeasure">Zapisz pomiary</button></p><p class="muted">Waga: najlepiej rano, kilka razy tygodniowo; oceniaj średnią z 7 dni. Brzuch: raz w tygodniu, po spokojnym wydechu.</p></section><section class="panel"><h2>Masa ciała • cel ${db.settings.targetWeight} kg</h2>${chart(db.weight,db.settings.targetWeight,'Masa')}<h2>Brzuch • cel ${db.settings.targetWaist} cm</h2>${chart(db.waist,db.settings.targetWaist,'Brzuch')}</section><section class="panel"><h2>Ostatnie pomiary</h2><table><tr><th>Data</th><th>Waga</th><th>Brzuch</th></tr>${Array.from(new Set([...db.weight.map(x=>x.date),...db.waist.map(x=>x.date)])).sort().reverse().slice(0,20).map(d=>`<tr><td>${d}</td><td>${db.weight.find(x=>x.date===d)?.value??'—'}</td><td>${db.waist.find(x=>x.date===d)?.value??'—'}</td></tr>`).join('')}</table></section>`}function foodView(){let s=db.settings;return `<section class="panel"><h2>Kalorie i makroskładniki</h2><div class="grid">${metric('Kalorie',s.cal,'kcal')}${metric('Białko',s.protein,'g')}${metric('Tłuszcze',s.fat,'g')}${metric('Węglowodany',s.carbs,'g')}</div><p class="muted">Wpisz dzienną sumę z aplikacji do liczenia kalorii lub własnych notatek.</p><div class="grid"><div class="field"><label>Data</label><input id="foodDate" type="date" value="${today()}"></div><div class="field"><label>Kalorie (kcal)</label><input id="foodCal" type="number" min="0"></div><div class="field"><label>Białko (g)</label><input id="foodProtein" type="number" min="0"></div><div class="field"><label>Tłuszcze (g)</label><input id="foodFat" type="number" min="0"></div><div class="field"><label>Węglowodany (g)</label><input id="foodCarbs" type="number" min="0"></div></div><p><button class="primary" id="saveFood">Zapisz dzień</button></p></section><section class="panel"><h2>Ostatnie dni</h2><table><tr><th>Data</th><th>kcal</th><th>B</th><th>T</th><th>W</th></tr>${db.food.slice().reverse().slice(0,20).map(x=>`<tr><td>${x.date}</td><td>${x.cal}</td><td>${x.protein}</td><td>${x.fat}</td><td>${x.carbs}</td></tr>`).join('')}</table></section>`}function settingsView(){return `<section class="panel"><h2>Twoje cele</h2><div class="grid">${[['cal','Kalorie (kcal)'],['protein','Białko (g)'],['fat','Tłuszcze (g)'],['carbs','Węglowodany (g)'],['steps','Kroki dziennie'],['targetWeight','Cel masy (kg)'],['targetWaist','Cel brzucha (cm)']].map(([k,l])=>`<div class="field"><label>${l}</label><input type="number" step="any" id="setting_${k}" value="${db.settings[k]}"></div>`).join('')}</div><p><button class="primary" id="saveSettings">Zapisz cele</button></p></section><section class="panel"><h2>Kopia zapasowa</h2><p>Eksportuj dane do pliku JSON i zachowaj go na dysku. Import odtworzy dane w tej przeglądarce.</p><input id="importFile" type="file" accept="application/json,.json"><p><button id="resetData">Usuń wszystkie wpisy</button></p></section>`}function upsert(k,entry){let i=db[k].findIndex(x=>x.date===entry.date);if(i>=0)db[k][i]=entry;else db[k].push(entry);db[k].sort((a,b)=>a.date.localeCompare(b.date));save()}function upsertWorkout(entry){
 entry.id=editWorkoutId||('w'+Date.now()+'_'+Math.random().toString(36).slice(2,7));
 const i=db.workouts.findIndex(x=>(x.id||x.date+'|'+x.type)===entry.id);
 if(i>=0)db.workouts[i]=entry;else db.workouts.push(entry);
 db.workouts.sort((a,b)=>a.date.localeCompare(b.date));save();
}
function bind(){if(tab==='Dzisiaj'){$('#goTraining').onclick=()=>{if(['A','B'].includes(assigned(today())))workoutType=assigned(today());setTab(['A','B'].includes(assigned(today()))?'Siłownia':'Bieganie')};$('#changeToday').onclick=()=>$('#dayEditor').classList.toggle('hide');$('#saveDay').onclick=()=>{db.overrides[today()]=$('#dayChoice').value;save();render()}}if(tab==='Siłownia'){
 restoreDraft();
 document.querySelectorAll('#view .warmup input,#view .exercise-item input,#gymNotes').forEach(el=>el.addEventListener('input',saveDraft));
 document.querySelectorAll('#view .exercise-item input').forEach(el=>el.addEventListener('change',saveDraft));
 $('#gymDate').onchange=()=>{workoutDate=$('#gymDate').value;editWorkoutId=null;render()};
 $('#clearDraft').onclick=()=>{if(confirm('Wyczyścić szkic tego treningu?')){delete drafts[draftKey()];localStorage.setItem(DRAFT_KEY,JSON.stringify(drafts));render()}};
 document.querySelectorAll('[data-edit-workout]').forEach(b=>b.onclick=()=>{const id=b.dataset.editWorkout;const x=db.workouts.find(x=>(x.id||x.date+'|'+x.type)===id);if(x){if(getDraft()&&!confirm('Otworzyć zapisany trening? Niezapisany szkic tego dnia zostanie zastąpiony.'))return;editWorkoutId=id;loadWorkoutToDraft(x)}});
 document.querySelectorAll('[data-delete-workout]').forEach(b=>b.onclick=()=>{const id=b.dataset.deleteWorkout;if(confirm('Usunąć zapisany trening z historii?')){db.workouts=db.workouts.filter(x=>(x.id||x.date+'|'+x.type)!==id);save();render()}});
 $('#wuTarget').addEventListener('input',updateWarmup);document.querySelectorAll('[data-rest]').forEach(b=>b.onclick=()=>startRest(Number(b.dataset.rest)));$('#stopRest').onclick=()=>{stopRest();restRemaining=0;showRest()};document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{saveDraft();workoutType=b.dataset.type;editWorkoutId=null;render()});document.querySelectorAll('[data-copy-kg]').forEach(b=>b.onclick=()=>{let rows=[...document.querySelectorAll('#setRows'+b.dataset.copyKg+' .set-row')];let first=rows[0]?.querySelector('[data-set-kg]')?.value||'';rows.slice(1).forEach(r=>r.querySelector('[data-set-kg]').value=first);saveDraft()});$('#saveGym').onclick=()=>{let date=$('#gymDate').value;if(!date)return alert('Wybierz datę');upsertWorkout({date,type:workoutType,notes:$('#gymNotes').value,exercises:exercises[workoutType].map((e,i)=>{let rows=[...document.querySelectorAll('#setRows'+i+' .set-row')];let series=rows.map(r=>({kg:r.querySelector('[data-set-kg]').value,reps:r.querySelector('[data-set-reps]').value,rir:r.querySelector('[data-set-rir]').value}));return {name:e[0],sets:e[1],reps:e[2],kg:series[0]?.kg||'',rir:series[0]?.rir||'',series,failure:$('#fail'+i).checked}})});delete drafts[draftKey()];localStorage.setItem(DRAFT_KEY,JSON.stringify(drafts));render();alert('Trening zapisany — dane pozostały widoczne w formularzu')}}if(tab==='Bieganie')$('#saveRun').onclick=()=>{let date=$('#runDate').value,km=n($('#runKm').value),min=n($('#runMin').value),hr=n($('#runHr').value);if(!date||!km||km<=0||!min||min<=0)return alert('Podaj datę, dystans i czas');upsert('runs',{date,km,min,hr:hr||null});render()};if(tab==='Pomiary')$('#saveMeasure').onclick=()=>{let date=$('#measureDate').value,w=$('#measureWeight').value,wa=$('#measureWaist').value;if(!date||(!w&&!wa))return alert('Podaj datę i przynajmniej jeden pomiar');if(w&&n(w)>0)upsert('weight',{date,value:n(w)});if(wa&&n(wa)>0)upsert('waist',{date,value:n(wa)});render()};if(tab==='Jedzenie')$('#saveFood').onclick=()=>{let date=$('#foodDate').value,cal=n($('#foodCal').value);if(!date||!$('#foodCal').value||cal<0)return alert('Podaj datę i kalorie');upsert('food',{date,cal,protein:n($('#foodProtein').value),fat:n($('#foodFat').value),carbs:n($('#foodCarbs').value)});render()};if(tab==='Ustawienia'){$('#saveSettings').onclick=()=>{Object.keys(db.settings).forEach(k=>db.settings[k]=n($('#setting_'+k).value));save();render()};$('#importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!data.settings||!Array.isArray(data.weight)||!Array.isArray(data.workouts))throw Error('Nieprawidłowy plik');if(confirm('Zastąpić aktualne dane danymi z pliku?')){db=data;save();render()}}catch(e){alert('Nie udało się wczytać pliku: '+e.message)}};$('#resetData').onclick=()=>{if(confirm('Na pewno usunąć WSZYSTKIE zapisane dane?')){db=structuredClone(initial);save();render()}}}}function render(){stopRest();restRemaining=0;nav();$('#view').innerHTML=({'Dzisiaj':todayView,'Siłownia':gymView,'Bieganie':runView,'Pomiary':measuresView,'Jedzenie':foodView,'Ustawienia':settingsView})[tab]();bind()}$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moja_redukcja_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></body></html>
